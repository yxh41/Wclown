name: Build WCRClownStandalone (roothide)

# 在 GitHub macOS runner 上用 roothide 官方 theos 分支直接构建 roothide .deb：
#   1) clone roothide/theos（内置 roothide package scheme，识别 Makefile 的 THEOS_PACKAGE_SCHEME = roothide）
#   2) make package 直接产出 iphoneos-arm64e 的 roothide .deb（无需 patch.sh）
# 动态探测 theos/sdks 中的最新 iPhoneOS SDK，用 sed 改写 Makefile 的 TARGET，
# 避免硬编码 SDK 版本缺失导致构建失败。commit 短哈希注入 control Version 与
# Tweak.xm 的 kWCRClownBuildTag，使 deb 与运行时日志自报构建来源，杜绝装错版本。
on:
  push:
    branches: [ main, master ]
    paths:
      - '**.m'
      - '**.h'
      - '**.xm'
      - 'Makefile'
      - 'control'
      - 'WCRClownStandalone.plist'
      - 'entry.plist'
      - 'Preferences/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || true

      - name: Install dependencies
        run: |
          brew install dpkg ldid gnu-sed findutils coreutils xz
          cpanm -n IO::Compress::Lzma 2>/dev/null || true

      - name: Install Theos (roothide fork)
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          for f in logos.pl dm.pl; do
            [ -e "$THEOS/bin/$f" ] && continue
            case "$f" in
              logos.pl) curl -fsSL https://raw.githubusercontent.com/theos/logos/master/logos.pl -o "$THEOS/bin/logos.pl" ;;
              dm.pl)    curl -fsSL https://raw.githubusercontent.com/theos/dm.pl/master/dm.pl -o "$THEOS/bin/dm.pl" ;;
            esac
            chmod +x "$THEOS/bin/$f"
          done

      - name: Install SDKs
        run: |
          rm -rf "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"
          ls -1 "$THEOS/sdks/" | grep -i iphone

      - name: Detect SDK version
        id: sdk
        run: |
          SDK=$(ls "$THEOS/sdks/" | grep -o 'iPhoneOS[0-9.]*\.sdk' | sed 's/iPhoneOS//;s/\.sdk//' | sort -V | tail -1)
          echo "sdk_version=$SDK" >> "$GITHUB_OUTPUT"
          echo "Detected latest SDK: $SDK"
          sed -i '' -E "s|^TARGET[ ]*:?=[ ].*|TARGET = iphone:clang:$SDK:15.0|" Makefile
          echo "Makefile TARGET now:"
          grep '^TARGET' Makefile

      - name: Patch package version + build tag with git hash
        run: |
          HASH=$(git rev-parse --short=7 HEAD 2>/dev/null || echo dev)
          echo "BUILD_HASH=$HASH" >> "$GITHUB_ENV"
          # control Version 追加 +<hash>，deb 永远自报自己的 commit
          sed -i '' -E "s|^Version:.*|Version: 0.0.8-probe+$HASH|" control
          echo "Patched control Version -> $(grep '^Version:' control)"
          # 运行时日志 kWCRClownBuildTag 同步追加 +<hash>，设置页/系统日志一眼核对是否新包
          sed -i '' -E "s|(kWCRClownBuildTag\[\] = \")[^\"]*(\")|\1wcrclown-0.0.8-probe+$HASH\2|" Tweak.xm
          echo "Patched build tag -> $(grep 'kWCRClownBuildTag' Tweak.xm)"

      - name: Build roothide .deb
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_ENV=silent 2>&1 | tee ci-build.log || make package FINALPACKAGE=1 2>&1 | tee ci-build.log
          # 把编译错误转成 GitHub Actions 注解（::error::），便于匿名读取定位未声明符号
          grep -iE "error:|undeclared identifier|No such file" ci-build.log | sed 's|^|::error::|' || true
          ROOTHIDE_DEB=$(ls packages/*_iphoneos-arm64e.deb 2>/dev/null | head -n1)
          echo "ROOTHIDE_DEB=$ROOTHIDE_DEB"
          echo "ROOTHIDE_DEB=$ROOTHIDE_DEB" >> "$GITHUB_ENV"
          [ -n "$ROOTHIDE_DEB" ] || { echo "No roothide .deb produced"; exit 1; }
          ls -la "$ROOTHIDE_DEB" || true
          # 以下均为纯诊断输出，任何一条报错都不能判构建失败（deb 已产出即成功）
          dpkg-deb -I "$ROOTHIDE_DEB" | head -20 || true
          # 打印实际打出的版本号（验证 control 的 Version 替换是否生效）
          BUILT_VER=$(dpkg-deb -f "$ROOTHIDE_DEB" Version 2>/dev/null || true)
          echo "::notice::WCRClownStandalone package version = ${BUILT_VER:-UNKNOWN}"

      - name: Upload build log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: ci-build.log
          if-no-files-found: warn
          retention-days: 90

      - name: Echo build errors as annotations
        if: failure()
        run: |
          grep -iE "error:|undeclared identifier|No such file" ci-build.log | sed 's|^|::error::|' || true

      - name: Upload roothide .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wclown-deb
          path: packages/*_iphoneos-arm64e.deb
          if-no-files-found: error
          retention-days: 90

      # 本地 PAT 偶发失效（REST API 401），改用 workflow 自带 GITHUB_TOKEN 把 .deb 推到
      # deb-artifacts 分支，本地直接 git fetch 取回，完全绕开 REST API。失败时也提交 ci-build.log 以便定位。
      - name: Publish .deb via git (bypass dead REST API)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@wclown.local"
          git config user.name "Wclown CI"
          SHA=$(git rev-parse --short=7 HEAD)
          TMP=$(mktemp -d)
          if [ -n "$ROOTHIDE_DEB" ] && [ -f "$ROOTHIDE_DEB" ]; then
            cp "$ROOTHIDE_DEB" "$TMP/wclown_${SHA}.deb"
            echo "publish: deb present"
          else
            echo "publish: no deb (build failed or skipped)"
          fi
          [ -f ci-build.log ] && cp ci-build.log "$TMP/ci-build.log"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin deb-artifacts 2>/dev/null || true
          git checkout --orphan deb-artifacts
          git reset --hard
          rm -rf .github .gitignore Makefile control *.xm *.m *.h *.plist 2>/dev/null || true
          git clean -fdx >/dev/null 2>&1 || true
          mkdir -p out
          cp "$TMP"/* out/ 2>/dev/null || true
          git add out 2>/dev/null || true
          git commit -m "build ${SHA} (deb=${ROOTHIDE_DEB:+1})" >/dev/null 2>&1 || echo "nothing to commit"
          git push --force origin deb-artifacts 2>&1 | tail -3
